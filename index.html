        /* IMPORTANTE: El navegador necesita saber que el fondo mide el 100% */
        html, body {

        .fullscreen-bg {

        .page {

            top: 0;
            left: 0;

        /* Si page es target: mostrar */

            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.3);

            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 10;

            flex-grow: 1; 
            /* Optional: Prevents buttons from stretching *too* wide if there's only 1 left on a row */
            min-width: 80px; 
            text-align: center; /* Keeps the text centered inside the stretching button */
        }

        .button-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            
            /* Give the container a responsive boundary to fill against */
            width: calc(100% - 40px); 
            max-width: 800px; /* Max desktop width before it stops growing */

</head>
